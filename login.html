<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZEROONE MARASEM — تسجيل الدخول</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #211d19;
            color: #f5f0e8;
            font-family: "Cairo", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 620px;

            border: 1px solid rgba(190, 158, 91, 0.35);
            border-radius: 16px;

            padding: 55px 45px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.025),
                    rgba(255,255,255,0.005)
                );

            box-shadow:
                0 25px 80px rgba(0,0,0,0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 42px;
        }

        .brand h1 {
            margin: 0;

            font-family: "Cormorant Garamond", serif;
            font-size: 34px;
            letter-spacing: 5px;

            color: #c7a66a;
        }

        .brand p {
            margin: 8px 0 0;

            color: #9d958b;
            font-size: 15px;
        }

        .field {
            margin-bottom: 22px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;

            color: #aaa097;
            font-size: 15px;
        }

        .field input {
            width: 100%;
            height: 64px;

            border: 1px solid #c8ad79;
            border-radius: 7px;

            background: #f7f3eb;
            color: #17130f;

            padding: 0 18px;

            font-family: "Cairo", sans-serif;
            font-size: 18px;

            outline: none;
        }

        .field input:focus {
            border-color: #d7bb82;

            box-shadow:
                0 0 0 3px rgba(199,166,106,0.12);
        }

        .login-button {
            width: 100%;
            height: 64px;

            margin-top: 10px;

            border: none;
            border-radius: 7px;

            background: #eee8dd;
            color: #211d19;

            font-family: "Cairo", sans-serif;
            font-size: 20px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .login-button:hover {
            background: #ffffff;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            display: none;

            margin-top: 20px;
            padding: 13px 15px;

            border-radius: 8px;

            text-align: center;
            font-size: 14px;
            line-height: 1.8;
        }

        .message.error {
            display: block;

            background: rgba(190, 55, 70, 0.12);
            border: 1px solid rgba(220, 80, 95, 0.35);
            color: #ef8994;
        }

        .message.success {
            display: block;

            background: rgba(100, 170, 120, 0.1);
            border: 1px solid rgba(100, 170, 120, 0.3);
            color: #9bd0a5;
        }

        .footer {
            margin-top: 30px;

            text-align: center;

            color: #6f6860;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            body {
                padding: 16px;
            }

            .login-card {
                padding: 42px 25px;
            }

            .brand h1 {
                font-size: 29px;
            }

            .field input {
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="brand">
            <h1>ZEROONE MARASEM</h1>
            <p>لوحة تحكم الإدارة</p>
        </div>

        <form id="loginForm" novalidate>

            <div class="field">
                <label for="email">البريد الإلكتروني</label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    placeholder="البريد الإلكتروني"
                    required
                >
            </div>

            <div class="field">
                <label for="password">كلمة المرور</label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="كلمة المرور"
                    required
                >
            </div>

            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                تسجيل الدخول
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="footer">
            ZEROONE — Digital Experiences
        </div>

    </main>

    <script type="module" src="./js/login.js"></script>

</body>
</html>
