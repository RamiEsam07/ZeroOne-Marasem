<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — ZEROONE MARASEM</title>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { ivory: '#F7F3EA', 'warm-ivory': '#EEE8DC', espresso: '#211C17', taupe: '#8D8272', 'muted-gold': '#B89B5E' },
                fontFamily: { cairo: ['Cairo', 'sans-serif'], garamond: ['Cormorant Garamond', 'serif'] }
            }}
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-espresso text-ivory font-cairo antialiased min-h-screen flex items-center justify-center p-4">

    <div id="toast-container" class="fixed top-5 left-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <div class="max-w-sm w-full bg-espresso border border-muted-gold/30 p-8 rounded-lg shadow-2xl space-y-6 text-center">
        <div class="space-y-1">
            <h1 class="text-xl font-garamond tracking-widest text-muted-gold font-bold">ZEROONE MARASEM</h1>
            <p class="text-[11px] text-taupe uppercase tracking-widest">لوحة تحكم الإدارة</p>
        </div>

        <form id="login-form" class="space-y-4 text-right">
            <div>
                <label class="block text-xs font-medium text-taupe mb-1">البريد الإلكتروني</label>
                <input type="email" id="login-email" required class="w-full bg-ivory text-espresso border border-taupe/30 px-4 py-2.5 rounded text-sm focus:outline-none focus:border-muted-gold">
            </div>
            <div>
                <label class="block text-xs font-medium text-taupe mb-1">كلمة المرور</label>
                <input type="password" id="login-password" required class="w-full bg-ivory text-espresso border border-taupe/30 px-4 py-2.5 rounded text-sm focus:outline-none focus:border-muted-gold">
            </div>
            <p id="login-error" class="hidden text-xs text-rose-400"></p>
            <button id="login-btn" type="submit" class="w-full bg-muted-gold text-espresso font-semibold py-3 rounded text-sm hover:bg-warm-ivory transition-colors">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <script src="js/utils.js"></script>
    <script type="module">
        import { loginAdmin } from "./js/auth.js";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'جاري الدخول...';

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                await loginAdmin(email, password);
                window.location.href = 'index.html';
            } catch (err) {
                let msg = 'تعذر تسجيل الدخول، تحقق من البيانات المدخلة';
                if (err.message === 'NOT_AUTHORIZED') {
                    msg = 'هذا الحساب غير مصرح له بالدخول إلى لوحة التحكم';
                } else if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                    msg = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                }
                errorEl.textContent = msg;
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
