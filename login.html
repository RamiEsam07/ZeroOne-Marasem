<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — ZEROONE MARASEM</title>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-bg { background: #211C17; }
        .login-card { background: #211C17; border: 1px solid rgba(184,155,94,.30); }
        .login-gold { color: #B89B5E; }
        .login-muted { color: #8D8272; }
        .login-input {
            width: 100%;
            background: #F7F3EA;
            color: #211C17;
            border: 1px solid rgba(141,130,114,.30);
            padding: .625rem 1rem;
            border-radius: .25rem;
            font-size: .875rem;
            outline: none;
        }
        .login-input:focus { border-color: #B89B5E; }
        .login-button {
            width: 100%;
            background: #B89B5E;
            color: #211C17;
            font-weight: 600;
            padding: .75rem 1rem;
            border-radius: .25rem;
            font-size: .875rem;
            border: 0;
            cursor: pointer;
            transition: background-color .2s ease, opacity .2s ease;
        }
        .login-button:hover { background: #EEE8DC; }
        .login-button:disabled { opacity: .65; cursor: wait; }
        .login-error { color: #fb7185; }
        .hidden { display: none !important; }
    </style>
</head>

<body class="login-bg text-ivory font-cairo antialiased min-h-screen flex items-center justify-center p-4">

    <div id="toast-container" class="fixed top-5 left-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <main class="max-w-sm w-full login-card p-8 rounded-lg shadow-2xl space-y-6 text-center">
        <div class="space-y-1">
            <h1 class="text-xl font-garamond tracking-widest login-gold font-bold">ZEROONE MARASEM</h1>
            <p class="text-[11px] login-muted uppercase tracking-widest">لوحة تحكم الإدارة</p>
        </div>

        <form id="login-form" class="space-y-4 text-right" novalidate>
            <div>
                <label for="login-email" class="block text-xs font-medium login-muted mb-1">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="login-email"
                    name="email"
                    autocomplete="username"
                    required
                    class="login-input"
                >
            </div>

            <div>
                <label for="login-password" class="block text-xs font-medium login-muted mb-1">كلمة المرور</label>
                <input
                    type="password"
                    id="login-password"
                    name="password"
                    autocomplete="current-password"
                    required
                    class="login-input"
                >
            </div>

            <p id="login-error" class="hidden text-xs login-error" role="alert" aria-live="polite"></p>

            <button id="login-btn" type="submit" class="login-button">
                تسجيل الدخول
            </button>
        </form>
    </main>

    <!-- Authentication logic is external to comply with the CSP. -->
    <script type="module" src="./js/login.js?v=1.2.0"></script>
</body>
</html>
